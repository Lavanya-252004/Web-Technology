<!DOCTYPE html>
<html>
<head>

<title>Elite Shopping Mall</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

    /* OFFER BANNER */

.offer-banner{

background:linear-gradient(
90deg,
#ff512f,
#dd2476
);

color:white;

text-align:center;

padding:15px;

font-size:20px;

font-weight:bold;

letter-spacing:1px;

animation:offerMove 3s infinite alternate;

}



@keyframes offerMove{

from{

transform:scale(1);

}


to{

transform:scale(1.03);

}

}


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}


body{

background:#f5f5f5;

}



/* HEADER */

header{

background:#131921;
color:white;
padding:18px 5%;
display:flex;
align-items:center;
justify-content:space-between;

}


.logo{

font-size:32px;
font-weight:bold;

}


.search-box{

width:40%;

}


.search-box input{

width:100%;
padding:12px;
border-radius:5px;
border:none;
font-size:16px;

}


.cart{

background:#ff9900;
padding:12px 20px;
border-radius:25px;
font-weight:bold;

}



/* CATEGORY MENU */


.menu{

background:white;
padding:20px;
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
box-shadow:0 2px 5px #ccc;

}


.menu button{

padding:12px 25px;
border:none;
background:#2563eb;
color:white;
border-radius:25px;
cursor:pointer;
font-size:15px;

}


.menu button:hover{

background:#ff9900;

}



/* FILTER AREA */


.filter-box{

background:white;
margin:25px auto;
width:90%;
padding:20px;
border-radius:10px;
display:flex;
gap:20px;
align-items:center;
flex-wrap:wrap;

}


.filter-box select,
.filter-box input{

padding:10px;
border:1px solid #aaa;
border-radius:5px;

}



.price-value{

font-weight:bold;
color:green;

}



/* PRODUCTS */


.container{

width:90%;
margin:auto;

}


.products{

display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:25px;

}



.card{

background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 15px #ccc;
transition:.3s;

}


.card:hover{

transform:translateY(-7px);

}


.card img{

width:100%;
height:250px;
object-fit:cover;

}


.details{

padding:20px;

}


.details h3{

margin-bottom:8px;

}


.category{

color:#777;
font-size:14px;

}


.price{

font-size:22px;
font-weight:bold;
color:#008000;
margin:12px 0;

}



.add-btn{

width:100%;
padding:12px;
background:#ff9900;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
font-weight:bold;

}


.add-btn:hover{

background:#ffb84d;

}



/* CART SIDE PANEL */


.cart-panel{

position:fixed;
right:0;
top:0;
width:350px;
height:100%;
background:white;
padding:20px;
box-shadow:-5px 0 15px #aaa;
overflow:auto;

}



.cart-panel h2{

text-align:center;
margin-bottom:20px;

}


.cart-item{

display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #ddd;
padding:15px 0;

}


.cart-item button{

background:red;
color:white;
border:none;
padding:5px 10px;
border-radius:5px;

}


.qty button{

background:#2563eb;
color:white;
padding:3px 8px;
border:none;
margin:3px;

}


.total{

font-size:25px;
font-weight:bold;
color:green;
text-align:center;
margin-top:20px;

}


.checkout{

background:#16a34a;
color:white;
border:none;
width:100%;
padding:15px;
margin-top:20px;
border-radius:10px;
font-size:18px;

}




footer{

background:#131921;
color:white;
padding:20px;
text-align:center;
margin-top:50px;

}



@media(max-width:700px){

header{

flex-direction:column;
gap:15px;

}

.search-box{

width:90%;

}


.cart-panel{

width:100%;

}

}



</style>

</head>


<body>

    <!-- DISCOUNT OFFER BANNER -->

<div class="offer-banner">

🔥 MEGA SALE 🔥  
Get Flat <b>50% OFF</b> on Fashion & Electronics  
| Free Delivery Above ₹999 | Limited Time Offer 🎉

</div>




<header>


<div class="logo">

Elite 🛒

</div>


<div class="search-box">

<input 
type="text"
id="search"
placeholder="Search products..."
onkeyup="searchProduct()">

</div>



<div class="cart">

Cart 🛍️
<span id="cartCount">
0
</span>

</div>


</header>





<div class="menu">


<button onclick="category('All')">
All
</button>


<button onclick="category('Men')">
Men
</button>


<button onclick="category('Women')">
Women
</button>


<button onclick="category('Kids')">
Kids
</button>


<button onclick="category('Electronics')">
Electronics
</button>


<button onclick="category('Groceries')">
Groceries
</button>


<button onclick="category('Footwear')">
Footwear
</button>


<button onclick="category('Accessories')">
Accessories
</button>


</div>





<div class="filter-box">


<label>

Price:

</label>


<input 
type="range"
id="priceRange"
min="100"
max="100000"
value="100000"
oninput="priceFilter()">



<span class="price-value">

₹<span id="priceShow">
100000
</span>

</span>



<select id="sort" onchange="sortProducts()">

<option value="">
Sort By
</option>

<option value="low">
Price Low to High
</option>


<option value="high">
Price High to Low
</option>


</select>



</div>





<div class="container">


<div class="products" id="products">


</div>


</div>






<div class="cart-panel">


<h2>
Shopping Cart
</h2>


<div id="cartItems">

Cart is empty

</div>


<div class="total">

Total ₹
<span id="total">
0
</span>

</div>

<button class="checkout" onclick="placeOrder()">

Proceed To Buy

</button>


</div>





<footer>

Elite Shopping Mall © 2026

</footer>





<script>

// PRODUCT DATABASE

let products = [

/* ================= MEN ================= */

{
id:1,
name:"Men Premium Shirt",
category:"Men",
price:999,
image:"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf",
desc:"Cotton formal shirt"
},

{
id:2,
name:"Men Black T-Shirt",
category:"Men",
price:599,
image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab",
desc:"Comfort casual wear"
},

{
id:3,
name:"Men Jacket",
category:"Men",
price:2499,
image:"https://images.unsplash.com/photo-1551028719-00167b16eac5",
desc:"Winter stylish jacket"
},



/* ================= WOMEN ================= */


{
id:4,
name:"Women Designer Dress",
category:"Women",
price:1999,
image:"https://images.unsplash.com/photo-1496747611176-843222e1e57c",
desc:"Party wear dress"
},

{
id:5,
name:"Women Saree",
category:"Women",
price:2999,
image:"https://images.unsplash.com/photo-1610030469983-98e550d6193c",
desc:"Traditional silk saree"
},

{
id:6,
name:"Women Handbag",
category:"Women",
price:1499,
image:"https://images.unsplash.com/photo-1584917865442-de89df76afd3",
desc:"Fashion handbag"
},



/* ================= KIDS ================= */


{
id:7,
name:"Kids T-Shirt",
category:"Kids",
price:499,
image:"https://images.unsplash.com/photo-1519238263530-99bdd11df2ea",
desc:"Soft cotton kids wear"
},

{
id:8,
name:"Kids Shoes",
category:"Kids",
price:899,
image:"https://images.unsplash.com/photo-1514989940723-e8e51635b782",
desc:"Comfortable shoes"
},



/* ================= ELECTRONICS ================= */


{
id:9,
name:"Gaming Laptop",
category:"Electronics",
price:75000,
image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853",
desc:"High performance laptop"
},


{
id:10,
name:"Smart Phone",
category:"Electronics",
price:30000,
image:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9",
desc:"Latest 5G smartphone"
},


{
id:11,
name:"Wireless Headphones",
category:"Electronics",
price:2999,
image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e",
desc:"Noise cancelling headphones"
},



/* ================= GROCERIES ================= */


{
id:12,
name:"Premium Rice 25kg",
category:"Groceries",
price:1400,
image:"https://images.unsplash.com/photo-1586201375761-83865001e31c",
desc:"Quality rice"
},


{
id:13,
name:"Cooking Oil",
category:"Groceries",
price:250,
image:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5",
desc:"Healthy sunflower oil"
},


{
id:14,
name:"Fresh Fruits Basket",
category:"Groceries",
price:600,
image:"https://images.unsplash.com/photo-1619566636858-adf3ef46400b",
desc:"Fresh fruits"
},



/* ================= FOOTWEAR ================= */


{
id:15,
name:"Running Shoes",
category:"Footwear",
price:3499,
image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff",
desc:"Sports running shoes"
},


{
id:16,
name:"Leather Sandals",
category:"Footwear",
price:1299,
image:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519",
desc:"Premium sandals"
},



/* ================= ACCESSORIES ================= */


{
id:17,
name:"Smart Watch",
category:"Accessories",
price:4999,
image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30",
desc:"Fitness tracking watch"
},


{
id:18,
name:"Travel Backpack",
category:"Accessories",
price:1799,
image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62",
desc:"Large travel bag"
}

];


// EMPTY CART

let cart=[];


// DEFAULT DISPLAY

displayProducts(products);

// ================= DISPLAY PRODUCTS =================


function displayProducts(list){


let productBox=document.getElementById("products");


productBox.innerHTML="";



if(list.length==0){

productBox.innerHTML="<h2>No Products Found</h2>";

return;

}



list.forEach(product=>{


productBox.innerHTML += `


<div class="card">


<img src="${product.image}">


<div class="details">


<h3>${product.name}</h3>


<p class="category">

${product.category}

</p>


<p>

${product.desc}

</p>



<div class="price">

₹${product.price}

</div>



<button class="add-btn"

onclick="addCart(${product.id})">

Add To Cart 🛒

</button>



</div>


</div>


`;

});


}






// ================= CATEGORY FILTER =================


let currentCategory="All";


function category(cat){


currentCategory=cat;


if(cat=="All"){


displayProducts(products);


}


else{


let result=products.filter(
p=>p.category==cat
);


displayProducts(result);


}


}







// ================= SEARCH =================



function searchProduct(){


let text=document
.getElementById("search")
.value
.toLowerCase();



let result=products.filter(p=>


p.name.toLowerCase()
.includes(text)



);



displayProducts(result);



}








// ================= PRICE FILTER =================



function priceFilter(){


let price=document
.getElementById("priceRange")
.value;



document.getElementById("priceShow")
.innerHTML=price;



let result=products.filter(p=>

p.price<=price

);



displayProducts(result);


}







// ================= SORT =================



function sortProducts(){


let value=document
.getElementById("sort")
.value;



let result=[...products];



if(value=="low"){


result.sort((a,b)=>a.price-b.price);


}


if(value=="high"){


result.sort((a,b)=>b.price-a.price);


}



displayProducts(result);



}







// ================= ADD TO CART =================



function addCart(id){



let item=products.find(
p=>p.id==id
);



let exist=cart.find(
p=>p.id==id
);



if(exist){


exist.qty++;


}

else{


cart.push({

...item,

qty:1

});


}



showCart();


}








// ================= SHOW CART =================



function showCart(){



let cartBox=document
.getElementById("cartItems");



let total=0;

let count=0;



if(cart.length==0){


cartBox.innerHTML="Cart is empty";


document.getElementById("total")
.innerHTML=0;


document.getElementById("cartCount")
.innerHTML=0;


return;


}



cartBox.innerHTML="";





cart.forEach(item=>{


total += item.price * item.qty;


count += item.qty;



cartBox.innerHTML += `



<div class="cart-item">


<div>


<b>${item.name}</b>


<br>


₹${item.price}



<div class="qty">


<button onclick="minus(${item.id})">
-
</button>


${item.qty}


<button onclick="plus(${item.id})">
+
</button>


</div>


</div>



<button onclick="removeCart(${item.id})">

X

</button>



</div>


`;



});





document.getElementById("total")
.innerHTML=total;



document.getElementById("cartCount")
.innerHTML=count;



}







// ================= PLUS QUANTITY =================



function plus(id){


let item=cart.find(
p=>p.id==id
);


item.qty++;


showCart();


}








// ================= MINUS QUANTITY =================



function minus(id){


let item=cart.find(
p=>p.id==id
);



if(item.qty>1){


item.qty--;


}

else{


removeCart(id);


}



showCart();



}








// ================= REMOVE ITEM =================



function removeCart(id){


cart=cart.filter(
p=>p.id!=id
);


showCart();


}
// ORDER PLACEMENT FUNCTION

function placeOrder(){


if(cart.length==0){

alert("Your cart is empty. Please add products first!");

return;

}



let orderId = Math.floor(Math.random()*900000)+100000;



alert(

"🎉 Order Placed Successfully!\n\n" +

"Order ID : #" + orderId +

"\n\nThank you for shopping with Elite  ❤️\n\n" +

"Your products will be delivered soon."

);



cart=[];

showCart();


}



</script>


</body>

</html>
